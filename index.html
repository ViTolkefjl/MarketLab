<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Маркет-Лаб Seller — тренажёр кабинета продавца</title>
<style>
:root{
  --bg:#f2f3f5;--surface:#fff;--ink:#16181d;--muted:#6b7180;--line:#e4e6eb;--hover:#f5f6f8;
  --acc:#6246ea;--acc-soft:#efebff;--ok:#10845a;--ok-soft:#e2f5ec;--warn:#a85b00;--warn-soft:#fff1dc;--bad:#c62f2f;--bad-soft:#fdeaea;
  --r:12px;font-family:-apple-system,"Segoe UI",Roboto,Inter,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
/* шапка */
.top{position:sticky;top:0;z-index:40;height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px}
.burger{display:none;border:0;background:none;padding:6px;cursor:pointer}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand small{font-weight:600;color:var(--muted);font-size:12px;margin-left:4px}
.store{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--hover);font-size:13px;white-space:nowrap}
.store .av{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.grow{flex:1}
.tstat{font-size:12px;color:var(--muted);white-space:nowrap}
.tstat b{display:block;color:var(--ink);font-size:14px}
.bell{position:relative;border:0;background:var(--hover);border-radius:10px;padding:7px 9px;cursor:pointer}
.bell i{position:absolute;top:-4px;right:-4px;background:var(--bad);color:#fff;font-style:normal;font-size:11px;border-radius:99px;padding:0 5px;line-height:17px}
.btn{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--acc-soft);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.next{background:#16181d;color:#fff}
.next .mt{display:none}
/* каркас */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr) 300px;min-height:calc(100vh - 56px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:10px 8px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:500}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--acc-soft);color:var(--acc)}
.nav-i svg{width:18px;height:18px;flex:none}
.nav-i .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;line-height:18px}
.nav-i .pulse{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#f5a524;box-shadow:0 0 0 3px #f5a52433}
.subnav{padding:2px 0 6px 38px}
.subnav button{display:block;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13.5px}
.subnav button:hover{background:var(--hover);color:var(--ink)}
.subnav button.on{color:var(--acc);font-weight:600}
.sep{height:1px;background:var(--line);margin:8px 6px}
main{padding:18px 20px 40px;min-width:0}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:4px}
h1{font-size:22px;margin:0 0 14px;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.tabs button i{font-style:normal;background:var(--hover);border-radius:99px;padding:0 7px;margin-left:4px;font-size:12px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;background:#f8f9fb;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.prod{display:flex;gap:10px;align-items:center;min-width:220px}
.thumb{width:40px;height:40px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:20px;background:#f1f2f6;border:1px solid var(--line)}
.prod b{display:block;font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-gray{background:#eef0f3;color:var(--muted)}
.b-acc{background:var(--acc-soft);color:var(--acc)}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
label .req{color:var(--bad)}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc-soft);border-color:var(--acc)}
textarea{min-height:110px;resize:vertical}
td input[type=number]{width:96px;padding:6px 8px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%}
.tips{margin:8px 0 0;padding-left:0;list-style:none}
.tips li{margin:4px 0;font-size:13px;display:flex;gap:6px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.media label{margin:0;border:1.5px dashed var(--line);border-radius:10px;padding:10px;cursor:pointer;color:var(--ink);font-size:12.5px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.media label.on{border-style:solid;border-color:var(--acc);background:var(--acc-soft)}
.media input{display:none}
.media .ic{font-size:22px}
.kwchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:3px;cursor:pointer;font-size:12.5px;background:#fff}
.kwchip:hover{border-color:var(--acc)}
.kwchip span{color:var(--muted)}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13.5px}
.a-warn{background:var(--warn-soft)}
.a-bad{background:var(--bad-soft)}
.a-ok{background:var(--ok-soft)}
.a-info{background:var(--acc-soft)}
.todo{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .dot{width:8px;height:8px;border-radius:50%;flex:none}
.todo .t{flex:1}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.steps span{font-size:12.5px;padding:4px 10px;border-radius:99px;background:#eef0f3;color:var(--muted)}
.steps span.on{background:var(--acc);color:#fff}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.slots button.on{border-color:var(--acc);background:var(--acc-soft)}
.review{border-bottom:1px solid var(--line);padding:12px 0}
.stars{color:#f5a524;letter-spacing:1px}
.chart{width:100%;height:auto;display:block}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mchips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;cursor:pointer;font-size:13px}
.mchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* миссии */
.mis{padding:16px 16px 16px 0}
.mis .card{position:sticky;top:72px}
.mis h3{font-size:16px;margin:4px 0 8px}
.task{background:var(--acc-soft);border-radius:10px;padding:10px 12px;font-size:13.5px}
.where{margin-top:8px;font-size:12.5px;color:var(--muted)}
.life{background:var(--ok-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--acc)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:90;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .e{font-size:34px}
dl.dict dt{font-weight:700;margin-top:12px}
dl.dict dd{margin:2px 0 0;color:#3a3f4a}
.overlay{display:none}
@media (max-width:1180px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .side{grid-row:1/span 2}
  .mis{grid-column:2;grid-row:1;padding:0 20px}
  main{grid-column:2;grid-row:2}
  .mis .card{position:static;margin:16px 0 0}
}
@media (max-width:760px){
  .top{gap:8px;padding:0 10px}
  .burger{display:block}
  .brand small,.store,.tstat.hide-m{display:none}
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:56px;bottom:0;width:270px;z-index:50;transform:translateX(-100%);transition:transform .2s;height:auto;box-shadow:4px 0 24px rgba(0,0,0,.12)}
  body.menu .side{transform:none}
  body.menu .overlay{display:block;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.3);z-index:45}
  .mis{grid-column:1;grid-row:1;padding:0 12px}
  main{grid-column:1;grid-row:2;padding:14px 12px 40px}
  .bell,.next .dt{display:none}
  .next .mt{display:inline}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  h1{font-size:19px}
  .next{padding:8px 10px}
}
</style>
</head>
<body>
<header class="top">
  <button class="burger" data-act="menu" aria-label="Меню"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="brand">Маркет-Лаб <small>Seller · тренажёр</small></div>
  <div class="store"><span class="av">В</span>Магазин Виталия</div>
  <div class="grow"></div>
  <div class="tstat hide-m">Дата<b id="tDate"></b></div>
  <div class="tstat">Баланс<b id="tMoney"></b></div>
  <button class="bell" data-go="home" aria-label="Уведомления"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg><i id="tBell" hidden></i></button>
  <button class="btn next" id="nextDay"><span class="dt">Следующий день</span><span class="mt">День</span> ▶</button>
</header>
<div class="overlay" data-act="menu"></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
  <div class="mis"><div class="card" id="mission"></div></div>
</div>

const KEY="marketlab_v2";
function fresh(){return{v:2,day:1,money:START,points:0,mi:0,route:"home",sel:null,
  products:[],supplies:[],orders:[],ledger:[],history:[],reviews:[],questions:[],campaigns:[],cpo:{on:false,rate:7},
  fbsWh:null,spent:{cogs:0,fees:0},draftSupply:null,ui:{tab:{},metric:"ordered",period:7,pfilter:"all"},
  flags:{},lastDone:null,events:[],seq:1}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||S.v!==2)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* =================== УТИЛИТЫ =================== */
const $=id=>document.getElementById(id);
const T=id=>TPL.find(t=>t.id===id);
const P=id=>S.products.find(p=>p.id===id);
const rub=n=>(n<0?"−":"")+Math.abs(Math.round(n)).toLocaleString("ru-RU")+" ₽";
const num=n=>Math.round(n).toLocaleString("ru-RU");
const pct=(n,d=1)=>(Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("ru-RU")+" %";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pois=x=>{const f=Math.floor(x);return f+(Math.random()<x-f?1:0)};
const dateOf=d=>new Date(2026,10,1+d).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
const fboTotal=p=>CLUSTERS.reduce((a,c)=>a+(p.fbo[c.id]||0),0);
const stockAll=p=>fboTotal(p)+p.fbs;
const onSale=p=>p.status==="ok"&&stockAll(p)>0;
function statusOf(p){
  if(p.status==="draft")return["Черновик","b-gray"];
  if(p.status==="moderation")return["На модерации","b-acc"];
  if(p.status==="error")return["С ошибками","b-bad"];
  return stockAll(p)>0?["В продаже","b-ok"]:["Готов к продаже","b-warn"];
}
const market=p=>Math.round(T(p.id).market*(p.compUntil>=S.day?.9:1));
const cycle=d=>Math.floor((d-1)/10);
const promoNow=()=>{const c=cycle(S.day);return{c,name:PROMOS[c%PROMOS.length],start:c*10+1,end:c*10+10,min:15+5*(c%2)}};
const promoOn=p=>p.promo&&p.promo.c===cycle(S.day);
const effPrice=p=>promoOn(p)?p.promo.price:p.price;
function priceIdx(p){const r=effPrice(p)/market(p);return r<=1.0?"good":r<=1.1?"mid":"bad"}
const IDX={good:["Выгодный","b-ok"],mid:["Умеренный","b-warn"],bad:["Невыгодный","b-bad"]};
function unitEcon(p,scheme,local){
  const t=T(p.id),price=effPrice(p),comm=price*t.comm,acq=price*ACQ;
  const log=scheme==="fbs"?LOG_FBS:(local?LOG_LOCAL:LOG_FAR),stor=scheme==="fbs"?0:STOR*14;
  const prof=price-comm-acq-log-stor-t.cost;
  return{price,comm,acq,log,stor,cost:t.cost,prof,margin:price>0?prof/price*100:0};
}
/* контент-рейтинг */
function contentParts(p){
  const t=T(p.id),c=p.card,title=c.title.toLowerCase(),ann=c.ann.toLowerCase(),k=t.kws.map(x=>x[0]);
  const L=c.title.trim().length,parts=[];
  parts.push(["Название 30–150 символов",L>=30&&L<=150?10:0,10]);
  parts.push(["Главный запрос «"+k[0]+"» в названии",title.includes(k[0])?10:0,10]);
  const ex=k.slice(1).filter(x=>title.includes(x)).length;parts.push(["Ещё 2 запроса в названии",ex>=2?5:ex*2,5]);
  const rq=t.req.filter(a=>(c.attrs[a]||"").trim()).length,op=t.opt.filter(a=>(c.attrs[a]||"").trim()).length;
  parts.push(["Обязательные характеристики ("+rq+"/3)",rq*5,15]);
  parts.push(["Дополнительные характеристики ("+op+"/3)",op*5,15]);
  let m=0;MEDIA.forEach(([id,,,w])=>{if(c.media[id])m+=w});parts.push(["Фото и видео",Math.min(27,m),27]);
  const al=c.ann.trim().length,ak=k.filter(x=>ann.includes(x)).length;
  parts.push(["Аннотация от 200 символов",al>=200?7:Math.floor(al/200*7),7]);
  parts.push(["2+ запроса в аннотации",ak>=2?3:ak,3]);
  parts.push(["Rich-контент",c.rich?5:0,5]);
  const kw=new Set(c.kws.split(",").map(x=>x.trim().toLowerCase()).filter(Boolean)).size;
  parts.push(["Ключевые слова: 5+",kw>=5?3:0,3]);
  return parts;
}
const cr=p=>contentParts(p).reduce((a,x)=>a+x[1],0);
function modErrors(p){
  const t=T(p.id),c=p.card,e=[];
  if(c.title.trim().length<15)e.push("Название слишком короткое — минимум 15 символов");
  if(!c.brand.trim())e.push("Укажи бренд или впиши «Нет бренда»");
  t.req.forEach(a=>{if(!(c.attrs[a]||"").trim())e.push("Не заполнена обязательная характеристика «"+a+"»")});
  if(!c.media.main)e.push("Нет главного изображения");
  return e;
}
/* доставка */
function deliveryInfo(p){
  const fa=fboTotal(p)>0;let dt=0,loc=0;
  CLUSTERS.forEach(c=>{let h;if((p.fbo[c.id]||0)>0){h=24;loc+=c.share}else if(fa&&p.fbs>0)h=55;else if(fa)h=50;else h=60;dt+=h*c.share});
  return{dt:Math.round(dt),local:loc};
}
const dtF=dt=>clamp(1.25-dt/160,.85,1.12);
/* отзывы и рейтинг */
function avgStars(pid){const r=S.reviews.filter(x=>!pid||x.pid===pid);return r.length?r.reduce((a,x)=>a+x.stars,0)/r.length:null}
const starsF=a=>a===null?.9:clamp(.55+.09*a,.7,1);
function ratingMetrics(){
  const from=S.day-30,rv=S.reviews.filter(r=>r.day>=from),avg=rv.length?rv.reduce((a,x)=>a+x.stars,0)/rv.length:null;
  const sale=S.products.filter(p=>p.status==="ok"),good=sale.filter(p=>priceIdx(p)==="good").length,share=sale.length?good/sale.length*100:null;
  const fbs=S.orders.filter(o=>o.scheme==="FBS"&&o.day>=from),canc=fbs.filter(o=>o.status==="cancelled").length,cr_=fbs.length?canc/fbs.length*100:null;
  const del=S.orders.filter(o=>o.day>=from&&(o.status==="delivered"||o.status==="returned")),ret=del.filter(o=>o.status==="returned").length,rr=del.length?ret/del.length*100:null;
  const z=(v,okF,warnF)=>v===null?"ok":okF(v)?"ok":warnF(v)?"warn":"bad";
  return[
   {name:"Оценка товаров",val:avg===null?"нет оценок":avg.toFixed(2)+" ★",zone:z(avg,v=>v>=4.5,v=>v>=4),n:rv.length,hint:"Средняя оценка в отзывах за 30 дней. Зелёная зона — от 4,5."},
   {name:"Индекс цен",val:share===null?"нет товаров":pct(share,0)+" выгодных",zone:z(share,v=>v>=70,v=>v>=40),hint:"Доля товаров в продаже с выгодным индексом цен. Зелёная зона — от 70 %."},
   {name:"Отмены по вине продавца",val:cr_===null?"нет заказов FBS":pct(cr_),zone:z(cr_,v=>v<=3,v=>v<=8),hint:"Доля заказов FBS, отменённых из-за того, что не собрал вовремя. Зелёная зона — до 3 %."},
   {name:"Доля возвратов",val:rr===null?"нет доставок":pct(rr),zone:z(rr,v=>v<=5,v=>v<=10),hint:"Возвраты от доставленных заказов. Зелёная зона — до 5 %."}
  ];
}
function ratingF(){const m=ratingMetrics();let f=1.05;m.forEach(x=>{if(x.zone==="warn")f-=.08;if(x.zone==="bad")f-=.2});return clamp(f,.5,1.05)}
/* история и финансы */
const H0={impr:0,visits:0,carts:0,ordered:0,sum:0,delivered:0,returned:0,cancelled:0,adImpr:0,adClicks:0,adSpend:0,adCarts:0,adOrders:0,adSum:0};
function sumHist(n,pid,key){const h=S.history.slice(-n);return h.reduce((a,d)=>{Object.keys(d.by).forEach(k=>{if(!pid||k===pid)a+=d.by[k][key]||0});return a},0)}
function adTotals(n,pid){const g=k=>sumHist(n,pid,k);const sp=g("adSpend"),sum=g("adSum"),im=g("adImpr"),cl=g("adClicks"),or=g("adOrders"),ca=g("adCarts");
  return{spend:sp,sum,impr:im,clicks:cl,orders:or,carts:ca,ctr:im?cl/im*100:0,drr:sum?Math.round(sp/sum*1000)/10:0,cpc:cl?sp/cl:0,cpo:or?sp/or:0,cartConv:cl?ca/cl*100:0}}
function ledgerSum(n,type){const from=S.day-n;return S.ledger.filter(e=>e.day>=from&&(!type||e.type===type)).reduce((a,e)=>a+e.amount,0)}
function addL(type,amount,pid,order){if(!amount)return;amount=Math.round(amount*100)/100;S.ledger.push({day:S.day,type,amount,pid,order});S.money+=amount}
function profit(){return S.ledger.reduce((a,e)=>a+e.amount,0)-S.spent.cogs-S.spent.fees}
const inGoods=()=>S.products.reduce((a,p)=>a+(stockAll(p)+S.supplies.filter(x=>x.pid===p.id&&(x.status==="transit"||x.status==="accept")).reduce((s,x)=>s+x.qty,0))*T(p.id).cost,0);
const oid=()=>String(48210000+S.seq++)+"-0001-1";
function log(t){S.events.unshift({day:S.day,t});S.events=S.events.slice(0,80)}

/* =================== СИМУЛЯЦИЯ ДНЯ =================== */
function nextDay(){
  const Y=S.day,msgs=[];const day={day:Y,by:{}};
  const rec=pid=>day.by[pid]||(day.by[pid]=Object.assign({},H0));
  // 1. модерация
  S.products.forEach(p=>{if(p.status==="moderation"&&p.modDay<=Y){const e=modErrors(p);p.errors=e;p.status=e.length?"error":"ok";if(p.status==="ok"&&!p.okDay)p.okDay=Y+1;msgs.push(e.length?"Карточка «"+T(p.id).name+"» не прошла модерацию: "+e.length+" ошибк."+"":"Карточка «"+T(p.id).name+"» прошла модерацию.")}});
  // 2. поставки
  S.supplies.forEach(x=>{
    if(x.status==="ready"&&x.slot<Y){x.status="expired";msgs.push("Поставка №"+x.no+" отменена: пропущен тайм-слот.")}
    else if(x.status==="transit"&&x.arrive<=Y){x.status="accept";x.acceptDay=Y+1}
    else if(x.status==="accept"&&x.acceptDay<=Y){

  S.orders.forEach(o=>{

      addL("Логистика",-(o.scheme==="FBS"?LOG_FBS:(o.local?LOG_LOCAL:LOG_FAR)),o.pid,o.id);addL("Эквайринг",-o.price*ACQ,o.pid,o.id);
      if(o.cpo)addL("Продвижение: оплата за заказ",-o.cpo,o.pid,o.id);
      S.spent.cogs+=t.cost;
      const q=cr(p)/100;

      if(Math.random()<.16)addReview(p,q,o.local||o.scheme==="FBS"?0:1);
    } else if(o.status==="delivered"&&o.returnDay&&o.returnDay<=Y){
      o.status="returned";rec(o.pid).returned++;
      addL("Возврат",-o.price,o.pid,o.id);addL("Комиссия за продажу",o.price*t.comm,o.pid,o.id);addL("Обратная логистика",-LOG_RET,o.pid,o.id);
      S.spent.cogs-=t.cost;p.fbo.kzn=(p.fbo.kzn||0)+1;

  const rF=ratingF(),pr=promoNow();
  S.products.forEach(p=>{

    const t=T(p.id),q=cr(p)/100,price=effPrice(p),idx=priceIdx(p),r=rec(p.id);
    const di=deliveryInfo(p),dF=dtF(di.dt),sF=starsF(avgStars(p.id));
    const ramp=clamp(.35+.1*(Y-(p.okDay||Y)),.35,1),idxF={good:1.1,mid:.8,bad:.4}[idx];
    const promoF=promoOn(p)?1.35:1,cpoF=S.cpo.on?1+S.cpo.rate/30:1;
    const impr=Math.round(t.traffic*(.25+.85*q)*idxF*rF*ramp*promoF*cpoF*rnd(.8,1.2));
    const media=MEDIA.reduce((a,[id,,,w])=>a+(p.card.media[id]?w:0),0);
    const ctr=.042*(.6+.6*media/27)*sF*(price<=market(p)?1.05:.9);
    const pf=clamp(market(p)/price,.3,1.6);
    const cart=.11*(.5+.6*q)*Math.pow(pf,.8)*dF*sF,oc=.42;
    let visits=pois(impr*ctr*rnd(.9,1.1)),carts=pois(visits*cart),orders=pois(carts*oc*rnd(.85,1.15));
    // реклама: оплата за клик
    const camp=S.campaigns.find(c=>c.pid===p.id&&c.on);let adO=0,adSpend=0;
    if(camp){
      const cap=camp.budget/7,avail=t.traffic*.03*clamp(camp.bid/t.compBid,.3,2.2)*(camp.place==="rec"?1.3:1)*(.6+.6*q);
      let clicks=Math.min(pois(avail*rnd(.85,1.15)),Math.floor(cap/(camp.bid*.9)));

      if((p.fbo[reg.id]||0)>0){scheme="FBO";cl=reg.id;local=true}

      else if(fboTotal(p)>0){scheme="FBO";cl=CLUSTERS.filter(c=>(p.fbo[c.id]||0)>0).sort((a,b)=>p.fbo[b.id]-p.fbo[a.id])[0].id}
      if(!scheme)break;
      const isAd=i>=orders;const o={id:oid(),pid:p.id,scheme,cluster:cl,local,day:Y,price,ad:isAd,region:reg.name};
      if(scheme==="FBO"){p.fbo[cl]--;o.status="delivering";o.deliverDay=Y+(local?1:2)}

  });
  // для миссии «Отзыв и вопрос» гарантируем материал
  if(MISSIONS[S.mi]&&MISSIONS[S.mi].t==="Отзыв и вопрос"){
    const sp=S.products.find(p=>p.status==="ok");
    if(sp&&!S.reviews.some(r=>r.stars<=3&&!r.answer)){S.reviews.push({id:"r"+S.seq++,pid:sp.id,day:Y,stars:2,text:"Пришло с царапиной на крышке, упаковка помята. Ожидал лучшего.",answer:""});msgs.push("Новый отзыв 2★ — загляни в «Отзывы».")}
    if(sp&&!S.questions.some(q=>!q.answer)){const t=T(sp.id);S.questions.push({id:"q"+S.seq++,pid:sp.id,day:Y,text:t.q[S.seq%t.q.length],answer:""});msgs.push("Покупатель задал вопрос — загляни в «Вопросы и ответы».")}
  }
  // 7. конкурент снизил цену
  const live=S.products.filter(p=>p.status==="ok");
  if(live.length&&Math.random()<.07){const p=live[Math.floor(Math.random()*live.length)];if(!(p.compUntil>=Y)){p.compUntil=Y+5;msgs.push("Конкуренты снизили цены на «"+T(p.id).name+"» примерно на 10 %. Проверь индекс цен.")}}
  // 8. остатки
  S.products.forEach(p=>{if(p.status!=="ok")return;const a=sumHist(3,p.id,"ordered")/3||0,l=stockAll(p);if(l===0&&a>0)msgs.push("«"+T(p.id).name+"» закончился — товар не продаётся.");else if(a>0&&l/a<4)msgs.push("«"+T(p.id).name+"»: остатка хватит примерно на "+Math.max(1,Math.floor(l/a))+" дн.")});
  S.history.push(day);if(S.history.length>90)S.history.shift();
  if(S.orders.length>600)S.orders=S.orders.filter(o=>o.day>Y-45);
  if(S.ledger.length>3000)S.ledger=S.ledger.filter(e=>e.day>Y-60);

  msgs.forEach(m=>log(m));
  S.lastMsgs=msgs;
  checkM();save();render();
  toast(dateOf(Y)+": заказов "+tot.o+" на "+rub(tot.s)+(msgs.length?" · событий: "+msgs.length:""));
}

const METRICS=[["sum","Заказано на сумму",v=>rub(v)],["ordered","Заказано товаров",num],["impr","Показы всего",num],["visits","Посещения карточки",num],["carts","Добавления в корзину",num],["delivered","Доставлено",num],["returned","Возвращено",num],["cancelled","Отменено",num]];
function series(key,n,pid){return S.history.slice(-n).map(d=>{let v=0;Object.keys(d.by).forEach(k=>{if(!pid||k===pid)v+=d.by[k][key]||0});return{day:d.day,v}})}
function chart(data,color){
  if(!data.length)return"";
  const W=640,Hh=220,L=52,R=12,Tp=12,B=28,vals=data.map(d=>d.v),max=Math.max(1,...vals);
  const x=i=>L+(data.length<2?(W-L-R)/2:i*(W-L-R)/(data.length-1)),y=v=>Tp+(1-v/max)*(Hh-Tp-B);
  const grid=[0,.5,1].map(f=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(max*f)+'" y2="'+y(max*f)+'" stroke="#e4e6eb"/><text x="'+(L-6)+'" y="'+(y(max*f)+4)+'" font-size="13" fill="#6b7180" text-anchor="end">'+num(max*f)+'</text>').join("");
  const step=Math.ceil(data.length/6);
  const xl=data.map((d,i)=>i%step===0||i===data.length-1?'<text x="'+x(i)+'" y="'+(Hh-8)+'" font-size="13" fill="#6b7180" text-anchor="middle">'+dateOf(d.day)+'</text>':"").join("");
  const pts=data.map((d,i)=>x(i)+","+y(d.v)).join(" ");
  const area='<polygon points="'+x(0)+","+y(0)+" "+pts+" "+x(data.length-1)+","+y(0)+'" fill="'+color+'" opacity=".08"/>';
  return'<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" style="font-size:13px">'+grid+area+'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.2"/>'+data.map((d,i)=>'<circle cx="'+x(i)+'" cy="'+y(d.v)+'" r="3" fill="'+color+'"><title>'+dateOf(d.day)+": "+num(d.v)+'</title></circle>').join("")+xl+'</svg>';
}

  (r.answer?'<div class="alert a-ok"><b>Ваш ответ:</b> '+esc(r.answer)+'</div>':'<label for="ra-'+r.id+'">Ответ продавца</label><textarea id="ra-'+r.id+'" style="min-height:70px" placeholder="Поблагодари, признай проблему, предложи решение"></textarea><button class="btn sm" style="margin-top:6px" data-ranswer="'+r.id+'">Ответить</button>')+'</div>').join(""):empty("💬",tab==="new"?"Все отзывы с ответом.":"Ответов пока нет."))+'</div>';
};
VIEWS["rev/questions"]=()=>{
  const list=S.questions.slice().reverse();
  return head("Отзывы","Вопросы и ответы")+'<div class="card">'+(list.length?list.map(q=>'<div class="review"><div class="row between"><b>'+esc(q.text)+'</b><span class="muted small">'+esc(T(q.pid).name)+' · '+dateOf(q.day)+'</span></div>'+
  (q.answer?'<div class="alert a-ok" style="margin-top:6px"><b>Ответ:</b> '+esc(q.answer)+'</div>':'<textarea id="qa-'+q.id+'" style="min-height:60px;margin-top:6px" placeholder="Ответь коротко и по делу"></textarea><button class="btn sm" style="margin-top:6px" data-qanswer="'+q.id+'">Ответить</button>')+'</div>').join(""):empty("❓","Вопросы покупателей появятся, когда товар будет в продаже."))+'</div>';
};

/* =================== РЕЙТИНГ =================== */
VIEWS["rating/seller"]=()=>{
  const m=ratingMetrics();
  return head("Рейтинги","Рейтинг продавца")+'<div class="g2">'+m.map(x=>'<div class="card"><div class="row between"><h2 style="margin:0">'+x.name+'</h2>'+zoneBadge(x.zone)+'</div><div style="font-size:24px;font-weight:700;margin:8px 0">'+x.val+'</div><p class="muted small" style="margin:0">'+x.hint+'</p></div>').join("")+'</div>'+
  '<div class="alert a-info">Показатели за последние 30 дней. Жёлтая и красная зоны в игре режут показы (сейчас множитель ×'+ratingF().toFixed(2)+'). Пороги учебные — в настоящем кабинете смотри свои.</div>';
};

/* =================== ОБУЧЕНИЕ =================== */
VIEWS["learn/missions"]=()=>head("Обучение","Все миссии")+'<div class="card"><div class="tw"><table><tr><th>№</th><th>Миссия</th><th>Где в кабинете</th><th>Статус</th></tr>'+MISSIONS.map((m,i)=>'<tr><td>'+(i+1)+'</td><td>'+m.t+'</td><td class="small">'+m.where+'</td><td>'+(i<S.mi?'<span class="badge b-ok">Готово</span>':i===S.mi?'<span class="badge b-acc">Сейчас</span>':'<span class="badge b-gray">Впереди</span>')+'</td></tr>').join("")+'</table></div></div>'+
  (S.mi>0?'<div class="card"><h2>Что запомнить для собеседования</h2>'+MISSIONS.slice(0,S.mi).map(m=>'<div class="life" style="margin-top:8px"><b>'+m.t+'.</b> '+m.life+'</div>').join("")+'</div>':"");
VIEWS["learn/dict"]=()=>head("Обучение","Словарь")+'<div class="card"><dl class="dict">'+DICT.map(([a,b])=>'<dt>'+a+'</dt><dd>'+b+'</dd>').join("")+'</dl></div>';
VIEWS["learn/save"]=()=>head("Обучение","Сохранение")+'<div class="card"><p>Прогресс сохраняется в этом браузере сам. Чтобы продолжить на другом устройстве — скачай файл и загрузи его там.</p><div class="row"><button class="btn" data-act="export">Скачать сохранение</button><button class="btn sec" data-act="import">Загрузить сохранение</button></div></div>'+
  '<div class="card"><h2>Начать заново</h2><p class="muted">Сотрёт весь прогресс в этом браузере.</p><button class="btn danger" data-act="reset1">Начать заново</button><div id="resetC"></div></div>'+
  '<div class="card"><h2>О тренажёре</h2><p class="muted small" style="margin:0">Маркет-Лаб — учебная игра. Разделы и термины повторяют устройство кабинета продавца крупного маркетплейса, но площадка, товары и все цифры вымышленные. Названия пунктов меню в настоящем кабинете могут немного отличаться и меняться со временем.</p></div>';

/* =================== ПАНЕЛЬ МИССИИ =================== */
function renderMission(){
  const el=$("mission"),i=S.mi,last=S.lastDone!=null?MISSIONS[S.lastDone]:null;
  const lifeB=last?'<div class="life"><b>Как в настоящем кабинете · «'+last.t+'»</b><br>'+last.life+'</div>':"";
  const prog='<div class="prog"><i style="width:'+(i/MISSIONS.length*100)+'%"></i></div>';
  if(i>=MISSIONS.length){el.innerHTML='<div class="small muted">Все '+MISSIONS.length+' миссий пройдены · '+S.points+' очков</div>'+prog+'<h3>🏆 Ты прошёл тренажёр</h3><p>Теперь в настоящем кабинете ты узнаешь все разделы. Попробуй вывести в плюс все 5 товаров.</p>'+lifeB;return}
  const m=MISSIONS[i];let inp="";
  if(m.input){const v=m.input.check(S);inp=v===null?'<p class="small muted">'+m.input.wait+'</p>':'<label for="m-in">'+m.input.label+'</label><div class="row"><input id="m-in" type="number" step="any" style="flex:1;min-width:0"><button class="btn sm" data-act="m-check">Проверить</button></div>'}
  el.innerHTML='<div class="small muted">Миссия '+(i+1)+' из '+MISSIONS.length+' · '+S.points+' очков</div>'+prog+'<h3>'+m.t+'</h3><div class="task">'+m.task+'</div><div class="where">📍 '+m.where+'</div>'+
  (S.route!==m.go?'<button class="btn sm sec" style="margin-top:8px" data-go="'+m.go+'">Перейти в раздел</button>':"")+inp+lifeB;
}
let tt;function toast(t){let e=document.querySelector(".toast");if(!e){e=document.createElement("div");e.className="toast";document.body.appendChild(e)}e.textContent=t;clearTimeout(tt);tt=setTimeout(()=>e.remove(),3800)}

/* =================== СОБЫТИЯ =================== */
$("nextDay").addEventListener("click",nextDay);
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-go],[data-act],[data-tab],[data-edit],[data-create],[data-kw],[data-saveprice],[data-calc],[data-promo-on],[data-promo-off],[data-slot],[data-ship],[data-supcancel],[data-pack],[data-fbsbuy],[data-camp-save],[data-camp-toggle],[data-metric],[data-period],[data-ranswer],[data-qanswer]");
  if(!el)return;const d=el.dataset;
  if(d.go){go(d.go);return}
  if(d.tab){S.ui.tab[d.tab]=d.val;save();render();return}
  if(d.edit){S.sel=d.edit;S.ui.tab.edit="main";go("products/edit");return}
  if(d.create){const t=T(d.create);S.products.push({id:t.id,sku:String(1700000000+Math.floor(Math.random()*9e8)),art:t.art,status:"draft",errors:[],card:{title:"",brand:"",attrs:{},media:{},ann:"",kws:"",rich:false},price:t.market,old:0,priceSet:false,fbo:{},fbs:0});S.sel=t.id;S.ui.tab.edit="main";log("Создан черновик карточки «"+t.name+"».");go("products/edit");return}
  if(d.kw){const p=P(S.sel),l=p.card.kws.split(",").map(x=>x.trim()).filter(Boolean);if(!l.includes(d.kw))l.push(d.kw);p.card.kws=l.join(", ");save();checkM();render();return}
  if(d.saveprice){const p=P(d.saveprice),v=Math.round(+$("pr-"+p.id).value),o=Math.round(+$("old-"+p.id).value)||0;if(!(v>0)){toast("Укажи цену");return}if(o&&o<=v){toast("Цена до скидки должна быть больше твоей цены");return}p.price=v;p.old=o;p.priceSet=true;S.sel=p.id;save();checkM();render();toast("Цена сохранена");return}
  if(d.calc){S.sel=d.calc;save();render();return}
  if(d.promoOn){const p=P(d.promoOn),pr=promoNow(),v=Math.round(+$("promo-"+p.id).value);if(!(v>0)||v>p.price*(1-pr.min/100)){toast("Цена по акции должна быть ниже обычной минимум на "+pr.min+" %");return}p.promo={c:pr.c,price:v};log("«"+T(p.id).name+"» участвует в акции «"+pr.name+"».");save();checkM();render();return}
  if(d.promoOff){P(d.promoOff).promo=null;save();render();return}
  if(d.slot){S.draftSupply.slot=+d.slot;save();render();return}
  if(d.ship){const x=S.supplies.find(s=>s.no==+d.ship),t=T(x.pid),c=CLUSTERS.find(z=>z.id===x.cluster),cost=x.qty*(t.cost+c.fee);if(cost>S.money){toast("Не хватает денег: нужно "+rub(cost));return}
    S.money-=cost;S.spent.fees+=x.qty*c.fee;x.status="transit";x.arrive=Math.max(x.slot,S.day+c.lead-1);log("Поставка №"+x.no+" отгружена: "+x.qty+" шт, закупка и доставка "+rub(cost)+".");save();checkM();render();toast("Поставка в пути");return}
  if(d.supcancel){S.supplies.find(s=>s.no==+d.supcancel).status="cancel";save();render();return}
  if(d.pack){const o=S.orders.find(z=>z.id===d.pack);o.status="await_ship";o.packed=true;save();checkM();render();toast("Заказ собран, ждёт отгрузки");return}
  if(d.fbsbuy){const p=P(d.fbsbuy),q=Math.floor(+$("fbsq-"+p.id).value),cost=q*T(p.id).cost;if(!(q>0)){toast("Укажи количество");return}if(cost>S.money){toast("Не хватает денег: нужно "+rub(cost));return}S.money-=cost;p.fbs+=q;S.spent.fees+=0;S.spent.cogs+=0;S.fbsBought=(S.fbsBought||0)+cost;log("Закуплено на свой склад: "+T(p.id).name+" "+q+" шт за "+rub(cost)+".");save();checkM();render();toast("Остаток FBS обновлён");return}
  if(d.campSave){const c=S.campaigns.find(z=>z.pid===d.campSave);c.bid=Math.max(1,Math.round(+$("cb-"+c.pid).value));c.budget=Math.max(700,Math.round(+$("cw-"+c.pid).value));save();render();toast("Кампания сохранена");return}
  if(d.campToggle){const c=S.campaigns.find(z=>z.pid===d.campToggle);c.on=!c.on;save();checkM();render();return}
  if(d.metric){S.ui.metric=d.metric;save();render();return}
  if(d.period){S.ui.period=+d.period;save();render();return}
  if(d.ranswer){const r=S.reviews.find(z=>z.id===d.ranswer),v=($("ra-"+r.id).value||"").trim();if(v.length<15){toast("Ответ слишком короткий");return}if(/дур|туп|сам винов|идиот|бред/i.test(v)){toast("Так покупателям не отвечают — перепиши без грубости");return}r.answer=v;save();checkM();render();toast("Ответ опубликован");return}
  if(d.qanswer){const q=S.questions.find(z=>z.id===d.qanswer),v=($("qa-"+q.id).value||"").trim();if(v.length<10){toast("Ответ слишком короткий");return}q.answer=v;save();checkM();render();toast("Ответ опубликован");return}
  const a=d.act;
  if(a==="menu"){document.body.classList.toggle("menu");return}
  if(a==="sendmod"){const p=P(S.sel);p.status="moderation";p.modDay=S.day;log("Карточка «"+T(p.id).name+"» отправлена на модерацию.");save();checkM();render();toast("Отправлено на модерацию. Результат — завтра.");return}
  if(a==="supply-new"){const r=S.products.filter(p=>p.status==="ok"||p.status==="moderation");S.draftSupply={pid:r[0].id,cluster:"kzn",qty:30,slot:null};save();render();return}
  if(a==="supply-cancel"){S.draftSupply=null;save();render();return}
  if(a==="supply-create"){const dr=S.draftSupply;if(!dr.slot){toast("Выбери тайм-слот");return}if(!(dr.qty>0)){toast("Укажи количество");return}
    S.supplies.push({no:S.supplies.length+1001,pid:dr.pid,cluster:dr.cluster,qty:dr.qty,slot:dr.slot,status:"ready"});S.draftSupply=null;log("Создана заявка на поставку: "+T(dr.pid).name+", "+dr.qty+" шт.");save();checkM();render();toast("Заявка создана. Отгрузи её до тайм-слота.");return}
  if(a==="packall"){S.orders.filter(o=>o.status==="await_pack").forEach(o=>{o.status="await_ship";o.packed=true});save();checkM();render();toast("Все заказы собраны");return}
  if(a==="wh-create"){const n=($("wh-name").value||"").trim()||"Мой склад";S.fbsWh=n;log("Создан склад FBS «"+n+"».");save();checkM();render();return}
  if(a==="camp-create"){const pid=$("c-pid").value,bid=Math.round(+$("c-bid").value),b=Math.round(+$("c-budget").value);if(!(bid>=1)){toast("Ставка от 1 ₽");return}if(!(b>=700)){toast("Бюджет от 700 ₽ в неделю");return}
    S.campaigns.push({pid,bid,budget:b,place:$("c-place").value,on:true});log("Запущена кампания «Оплата за клик» на «"+T(pid).name+"».");save();checkM();render();toast("Кампания запущена");return}
  if(a==="cpo-save"){S.cpo.on=$("cpo-on").checked;S.cpo.rate=clamp(Math.round(+$("cpo-rate").value)||7,5,30);save();checkM();render();toast("Сохранено");return}
  if(a==="m-check"){const m=MISSIONS[S.mi],v=parseFloat(String($("m-in").value).replace(",",".")),ans=m.input.check(S);
    if(ans!==null&&Math.abs(v-ans)<=m.input.tol+1e-9){S.flags["m"+(S.mi+1)]=true;checkM();save();render()}else toast("Не совпадает. Проверь период и раздел: "+m.where);return}
  if(a==="export"){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="marketlab-day"+S.day+".json";document.body.appendChild(l);l.click();l.remove();return}
  if(a==="import"){$("importFile").click();return}
  if(a==="reset1"){$("resetC").innerHTML='<p><b>Точно стереть всё?</b></p><button class="btn danger" data-act="reset2">Да, начать заново</button>';return}
  if(a==="reset2"){S=fresh();save();render();toast("Новая игра");return}
});
document.addEventListener("input",e=>{
  const t=e.target,p=P(S.sel);
  if(t.dataset.f&&p){p.card[t.dataset.f]=t.value;const l=$("len-"+t.dataset.f);if(l)l.textContent=t.value.length+" симв."}
  else if(t.dataset.attr&&p){p.card.attrs[t.dataset.attr]=t.value}
  else if(t.id==="sp-qty"&&S.draftSupply){S.draftSupply.qty=Math.max(0,Math.floor(+t.value));updSupplySum();save();return}
  else return;
  save();const b=$("ratingBox");if(b)b.innerHTML=ratingBox(p);if(checkM()){save();renderMission();renderSide()}
});
document.addEventListener("change",e=>{
  const t=e.target,p=P(S.sel);
  if(t.dataset.media&&p){p.card.media[t.dataset.media]=t.checked;t.closest("label").classList.toggle("on",t.checked);save();const b=$("ratingBox");if(b)b.innerHTML=ratingBox(p);if(checkM()){save();renderMission()}return}
  if(t.dataset.rich&&p){p.card.rich=t.checked;save();const b=$("ratingBox");if(b)b.innerHTML=ratingBox(p);if(checkM()){save();renderMission()}return}
  if(t.id==="sp-pid"){S.draftSupply.pid=t.value;save();render();return}
  if(t.id==="sp-cl"){S.draftSupply.cluster=t.value;S.draftSupply.slot=null;save();render();return}
  if(t.id==="pfilter"){S.ui.pfilter=t.value;save();render();return}
  if(t.id==="sq-pid"){S.sel=t.value;save();render();return}
});
$("importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.v!==2||!d.products)throw 0;S=d;save();render();toast("Сохранение загружено: день "+S.day)}catch(err){toast("Это не файл сохранения Маркет-Лаб")}};r.readAsText(f);e.target.value=""});
render();
</script>
</body>
</html>
